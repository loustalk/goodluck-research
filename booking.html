<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e6dc">

    <title>聯絡／預約｜好運研究所</title>
    <meta name="description" content="好運研究所｜聯絡小盧老師，提供線上諮詢與 Facebook 聯絡入口。">

    <style>
        :root {
            --ivory: #f3e6dc;
            --cream: #f8eee6;
            --rose-gold: #a86e53;
            --rose-light: #e6cbb9;
            --tea-gold: #a17a43;
            --gold-light: #ead7b7;
            --brown: #76513f;
            --brown-dark: #62594f;
            --text: #76513f;
            --text-light: #8c6c5b;
            --border: #e6cbb9;
            --white: #fffaf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei",
                "PingFang TC", Arial, sans-serif;
            background: var(--ivory);
            color: var(--text);
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 導覽列 */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(243, 230, 220, 0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .nav {
            max-width: 1180px;
            margin: auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--brown);
            white-space: nowrap;
        }

        .logo span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 3px;
            color: var(--tea-gold);
            margin-top: -5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
        }

        .nav-links a {
            color: var(--text);
            transition: color 0.25s;
        }

        .nav-links a:hover {
            color: var(--rose-gold);
        }

        /* 頁首主視覺 */
        .hero {
            position: relative;
            overflow: hidden;
            padding: 90px 24px 70px;
            text-align: center;
            background:
                radial-gradient(
                    ellipse at 50% 15%,
                    rgba(217, 195, 155, 0.28),
                    transparent 48%
                ),
                linear-gradient(180deg, #fffaf6 0%, #f3e6dc 100%);
            border-bottom: 1px solid rgba(168, 110, 83, 0.15);
        }

        .hero::before,
        .hero::after {
            content: "❧";
            position: absolute;
            color: rgba(161, 122, 67, 0.20);
            font-family: serif;
            font-size: 100px;
            line-height: 1;
            pointer-events: none;
        }

        .hero::before {
            left: max(5%, calc((100% - 1100px) / 2));
            top: 32px;
            transform: rotate(-35deg);
        }

        .hero::after {
            right: max(5%, calc((100% - 1100px) / 2));
            bottom: 10px;
            transform: rotate(145deg);
        }

        .eyebrow {
            position: relative;
            z-index: 1;
            display: inline-block;
            padding: 6px 18px;
            margin-bottom: 18px;
            border: 1px solid var(--gold-light);
            border-radius: 30px;
            color: #a17a43;
            background: rgba(255, 250, 246, 0.75);
            font-size: 12px;
            letter-spacing: 2px;
        }

        .hero h1 {
            position: relative;
            z-index: 1;
            color: var(--brown);
            font-size: clamp(40px, 6vw, 62px);
            line-height: 1.3;
            letter-spacing: 6px;
            margin-bottom: 20px;
        }

        .hero h1::after {
            content: "";
            display: block;
            width: 76px;
            height: 2px;
            margin: 20px auto 0;
            background: linear-gradient(
                90deg,
                transparent,
                var(--rose-gold),
                var(--gold-light),
                transparent
            );
        }

        .hero p {
            position: relative;
            z-index: 1;
            max-width: 650px;
            margin: auto;
            color: var(--text-light);
            font-size: 16px;
        }

        /* 聯絡內容 */
        .contact-section {
            padding: 40px 24px 100px;
            background:
                radial-gradient(
                    circle at 0% 30%,
                    rgba(230, 203, 185, 0.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 100% 70%,
                    rgba(230, 203, 185, 0.12),
                    transparent 28%
                ),
                var(--ivory);
        }

        .contact-inner {
            max-width: 1000px;
            margin: auto;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 28px;
        }

            overflow: hidden;
            background: rgba(255, 250,
