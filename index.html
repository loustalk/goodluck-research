<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>好運研究所｜占卜・風水・財運・生活好運</title>

    <meta name="description" content="好運研究所｜由小盧老師主持，分享占卜、風水、財運分析，以及故事、Podcast、YouTube與生活裡關於好運的觀察。">

    <style>
        * { box-sizing:border-box; margin:0; padding:0; }

        html {
            scroll-behavior:smooth;
        }

        body {
            font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",Arial,sans-serif;
            background:#faf8f3;
            color:#333;
            line-height:1.8;
        }

        a {
            text-decoration:none;
            color:inherit;
        }

        header {
            position:sticky;
            top:0;
            z-index:1000;
            background:rgba(250,248,243,.96);
            border-bottom:1px solid #e8e0d2;
            backdrop-filter:blur(10px);
        }

        .nav {
            max-width:1180px;
            margin:auto;
            padding:16px 24px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
        }

        .logo {
            font-size:22px;
            font-weight:700;
            letter-spacing:2px;
            color:#7a5735;
            white-space:nowrap;
        }

        .logo span {
            display:block;
            font-size:11px;
            font-weight:400;
            letter-spacing:3px;
            color:#a08a70;
            margin-top:-5px;
        }

        .nav-links {
            display:flex;
            gap:24px;
            align-items:center;
            font-size:14px;
        }

        .nav-links a {
            color:#5d554c;
            transition:.25s;
        }

        .nav-links a:hover {
            color:#a66f32;
        }

        /* =========================
           桌機 Hero
           ========================= */

        .hero {
            position:relative;
            min-height:680px;
            padding:90px 24px 100px;
            display:flex;
            align-items:center;

            background-image:url('uploads/hero-oriental-main.png');
            background-size:cover;
            background-position:center center;
            background-repeat:no-repeat;

            overflow:hidden;
        }

        .hero-mobile-image {
            display:none;
        }

        .hero::before {
            content:"";
            position:absolute;
            inset:0;

            background:linear-gradient(
                90deg,
                rgba(255,250,246,.78) 0%,
                rgba(255,250,246,.58) 32%,
                rgba(255,250,246,.18) 62%,
                rgba(255,250,246,.02) 100%
            );

            pointer-events:none;
        }

        .hero-inner {
            position:relative;
            z-index:1;

            max-width:1180px;
            width:100%;
            margin:auto;

            display:grid;
            grid-template-columns:1.15fr .85fr;
            gap:70px;
            align-items:center;
        }

        .hero-text .eyebrow {
            display:inline-block;
            margin-bottom:18px;
            padding:6px 15px;
            border:1px solid #d9c4a4;
            border-radius:30px;
            color:#987044;
            font-size:13px;
            letter-spacing:2px;
        }

        .hero h1 {
            font-family:
                "DFNewChuan-B5",
                "DFNewChuanHK-W5",
                "華康新篆體",
                "Noto Serif TC",
                "PMingLiU",
                serif;

            font-size:clamp(58px,7.2vw,88px);
            font-weight:normal;
            line-height:1.12;
            letter-spacing:6px;

            color:#68482d;
            -webkit-text-stroke:1.1px #68482d;
            paint-order:stroke fill;

            margin-bottom:18px;
        }

        .hero h2 {
            font-family:
                "DFLiShuW5-B5",
                "DFLiShuHK-W5",
                "華康隸書體",
                "Noto Serif TC",
                "PMingLiU",
                serif;

            font-size:clamp(25px,3vw,34px);
            font-weight:normal;
            line-height:1.55;
            letter-spacing:3px;

            color:#51473e;
            -webkit-text-stroke:.75px #51473e;
            paint-order:stroke fill;

            margin-bottom:25px;
        }

        .hero p {
            max-width:650px;
            color:#4f3526;
            font-size:16px;
            font-weight:500;
        }

        .hero-buttons {
            margin-top:35px;
            display:flex;
            gap:14px;
            flex-wrap:wrap;
        }

        .btn {
            display:inline-block;
            padding:12px 25px;
            border-radius:30px;
            font-size:14px;
            transition:.25s;
        }

        .btn-primary {
            background:#87613b;
            color:white;
        }

        .btn-primary:hover {
            background:#68482d;
            transform:translateY(-2px);
        }

        .btn-outline {
            border:1px solid #cbb99e;
            color:#755839;
            background:rgba(255,255,255,.45);
        }

        .btn-outline:hover {
            background:white;
        }

        .hero-card {
            display:none;
        }

        .hero-symbol {
            text-align:center;
        }

        .hero-symbol .circle {
            width:190px;
            height:190px;
            margin:auto auto 25px;
            border:1px solid #b99463;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:72px;
            background:rgba(255,255,255,.35);
        }

        .hero-symbol h3 {
            color:#765332;
            font-size:22px;
            letter-spacing:4px;
        }

        .hero-symbol p {
            margin-top:5px;
            font-size:13px;
            color:#97836d;
        }

        /* =========================
           Facebook
           ========================= */

        .facebook-section {
            background:#f0ebe2;
            padding:70px 24px;
        }

        .section-inner {
            max-width:1080px;
            margin:auto;
        }

        .section-title {
            text-align:center;
            margin-bottom:40px;
        }

        .section-title small {
            display:block;
            color:#a07b50;
            font-size:12px;
            letter-spacing:3px;
            margin-bottom:8px;
        }

        .section-title h2 {
            font-size:32px;
            color:#62472f;
            letter-spacing:3px;
        }

        .facebook-box {
            width:100%;
            padding:0;
            background:transparent;
            border:none;
            border-radius:0;
            text-align:center;
            box-shadow:none;
        }

        .facebook-box strong {
            display:block;
            margin-bottom:8px;
            color:#735437;
            font-size:20px;
        }

        .facebook-box > div:first-child p {
            color:#81786e;
            font-size:14px;
        }

        .facebook-posts {
            width:100%;
            max-width:560px;
            margin:30px auto 0;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:24px;
        }

        .facebook-post-embed {
            width:100%;
            max-width:560px;
            text-align:left;
        }

        .facebook-empty,
        .facebook-error,
        .facebook-loading {
            padding:24px;
            color:#81786e;
            font-size:14px;
        }

        .facebook-button {
            margin-top:24px;
            text-align:center;
        }

        /* Facebook 原生貼文卡片：
           不使用 Facebook 內嵌框架，避免「查看更多」灰屏 */

        .facebook-custom-card {
            width:100%;
            background:#fffdf9;
            border:1px solid #e4d8c8;
            border-radius:16px;
            padding:22px 24px;
            box-shadow:0 8px 24px rgba(75,54,33,.06);
            color:#5b5147;
        }

        .facebook-custom-meta {
            font-size:12px;
            color:#9a8268;
            margin-bottom:10px;
        }

        .facebook-custom-message {
            font-size:15px;
            line-height:1.9;
            white-space:pre-wrap;
            overflow-wrap:anywhere;
            text-align:left;
        }

        .facebook-custom-actions {
            display:flex;
            gap:16px;
            flex-wrap:wrap;
            align-items:center;
            margin-top:16px;
            font-size:14px;
        }

        .facebook-expand {
            border:0;
            background:transparent;
            color:#8a6239;
            font:inherit;
            font-weight:600;
            cursor:pointer;
            padding:4px 0;
        }

        .facebook-expand:hover,
        .facebook-original-link:hover {
            color:#68482d;
        }

        .facebook-original-link {
            color:#8a6239;
            font-weight:600;
            text-decoration:underline;
            text-underline-offset:3px;
        }

        /* =========================
           研究室
           ========================= */

        .rooms {
            padding:100px 24px;
            background:#faf8f3;
        }

        .room-grid {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:22px;
        }

        .room-card {
            min-height:0;
            padding:0;
            background:white;
            border:1px solid #e7ddd0;
            border-radius:20px;
            transition:.3s;
            position:relative;
            overflow:hidden;
        }

        .room-card:hover {
            transform:translateY(-5px);
            box-shadow:0 15px 35px rgba(75,54,33,.09);
        }

        .room-image {
            width:100%;
            aspect-ratio:16/10;
            object-fit:cover;
            display:block;
        }

        .room-content {
            padding:24px 26px 30px;
            position:relative;
        }

        .room-card h3 {
            font-size:21px;
            color:#694b31;
            margin-bottom:10px;
        }

        .room-card p {
            font-size:14px;
            color:#81776d;
            margin-right:30px;
        }

        .room-card .arrow {
            position:absolute;
            right:24px;
            bottom:24px;
            color:#b18b5d;
            font-size:20px;
        }

        /* =========================
           關於
           ========================= */

        .about {
            padding:100px 24px;
            background:#eee7dc;
        }

        .about-inner {
            max-width:1180px;
            margin:auto;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:60px;
            align-items:center;
        }

        .about-image {
            width:100%;
            aspect-ratio:3/2;
            border-radius:25px;
            overflow:hidden;
            background:#d9c5a7;
            border:1px solid #d2bea1;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .about-image img {
            width:100%;
            height:100%;
            display:block;
            object-fit:cover;
            object-position:center center;
        }

        .about-text small {
            color:#a07748;
            letter-spacing:3px;
        }

        .about-text h2 {
            font-size:34px;
            color:#61452e;
            margin:10px 0 22px;
        }

        .about-text p {
            color:#6f665d;
            margin-bottom:15px;
        }

        /* =========================
           內容
           ========================= */

        .content-section {
            padding:100px 24px;
            background:#faf8f3;
        }

        .content-grid {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:24px;
        }

        .content-card {
            background:white;
            border-radius:18px;
            overflow:hidden;
            border:1px solid #e5dbce;
        }

        .content-link {
            display:block;
            color:inherit;
            transition:.3s;
        }

        .content-link:hover {
            transform:translateY(-5px);
            box-shadow:0 15px 35px rgba(75,54,33,.09);
        }

        .content-image {
            height:175px;
            background:linear-gradient(135deg,#e8dac3,#f5f0e8);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:45px;
        }

        .content-body {
            padding:24px;
        }

        .content-body small {
            color:#a47b4d;
        }

        .content-body h3 {
            margin:7px 0 10px;
            color:#674a31;
            font-size:19px;
        }

        .content-body p {
            color:#817970;
            font-size:14px;
        }

        /* =========================
           未來
           ========================= */

        .future {
            padding:90px 24px;
            background:#4d4034;
            color:white;
        }

        .future-inner {
            max-width:1000px;
            margin:auto;
            text-align:center;
        }

        .future h2 {
            font-size:32px;
            letter-spacing:3px;
            margin-bottom:20px;
        }

        .future p {
            max-width:700px;
            margin:auto;
            color:#ddd2c5;
        }

        .future-list {
            margin-top:40px;
            display:flex;
            justify-content:center;
            gap:18px;
            flex-wrap:wrap;
        }

        .future-item {
            padding:12px 22px;
            border:1px solid #887968;
            border-radius:30px;
            color:#f2e7d8;
            font-size:14px;
        }

        /* =========================
           聯絡
           ========================= */

        .contact {
            padding:105px 24px;
            background:#f5f0e8;
            text-align:center;
        }

        .contact-box {
            max-width:920px;
            min-height:300px;
            margin:0 auto;
            padding:55px 70px;
            background:white;
            border:1px solid #e2d7c8;
            border-radius:24px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            box-shadow:0 15px 35px rgba(75,54,33,.06);
        }

        .contact h2 {
            color:#65482f;
            font-size:31px;
            margin-bottom:15px;
        }

        .contact p {
            max-width:680px;
            color:#776e65;
            margin-bottom:28px;
        }

        /* =========================
           Footer
           ========================= */

        footer {
            padding:35px 24px;
            background:#342b24;
            color:#cfc3b5;
            text-align:center;
            font-size:12px;
        }

        footer strong {
            display:block;
            color:#eee4d7;
            font-size:16px;
            margin-bottom:5px;
        }

        /* =====================================================
           平板／手機
           這次從 850px 就開始完整 Hero 圖片模式
           ===================================================== */

        @media (max-width:850px) {

            .nav {
                padding:13px 18px;
            }

            .nav-links {
                display:none;
            }

            /* 手機 Hero：不再使用 background-cover */
            .hero {
                min-height:0;
                padding:0;
                display:block;

                background-image:none;
                background-color:#faf8f3;

                overflow:hidden;
            }

            /* 顯示完整 Hero 圖，不裁切 */
            .hero-mobile-image {
                display:block;
                width:100%;
                height:auto;
                margin:0;
                padding:0;

                object-fit:contain;
                object-position:center top;
            }

            /* 手機不需要桌機的白色漸層 */
            .hero::before {
                display:none;
            }

            /* 文字改到圖片下面 */
            .hero-inner {
                width:100%;
                max-width:none;

                display:block;

                padding:55px 20px 65px;
            }

            .hero-text {
                width:100%;
            }

            /* 手機使用系統相容字體 */
            .hero h1 {
                font-family:
                    "Noto Sans TC",
                    "Microsoft JhengHei",
                    "PingFang TC",
                    Arial,
                    sans-serif;

                font-size:52px;
                font-weight:700;
                line-height:1.2;
                letter-spacing:2px;

                color:#68482d;
                -webkit-text-stroke:0;
                paint-order:normal;

                margin-bottom:18px;
            }

            .hero h2 {
                font-family:
                    "Noto Sans TC",
                    "Microsoft JhengHei",
                    "PingFang TC",
                    Arial,
                    sans-serif;

                font-size:25px;
                font-weight:600;
                line-height:1.65;
                letter-spacing:1px;

                color:#51473e;
                -webkit-text-stroke:0;
                paint-order:normal;

                margin-bottom:25px;
            }

            .hero p {
                max-width:100%;
                font-size:16px;
                line-height:2;
                font-weight:500;
                color:#4f3526;
            }

            .hero-buttons {
                margin-top:35px;
                display:flex;
                flex-direction:column;
                gap:14px;
            }

            .btn {
                width:100%;
                text-align:center;
                padding:15px 20px;
                font-size:16px;
            }

            .hero-card {
                display:none;
            }

            .room-grid,
            .content-grid {
                grid-template-columns:1fr;
            }

            .about-inner {
                grid-template-columns:1fr;
                gap:35px;
            }

            .about-image {
                aspect-ratio:3/2;
            }

            .about-image img {
                min-height:0;
            }

            .section-title h2 {
                font-size:27px;
            }
        }

        /* =========================
           更窄手機
           ========================= */

        @media (max-width:480px) {

            .logo {
                font-size:19px;
            }

            .hero-inner {
                padding:45px 20px 55px;
            }

            .hero h1 {
                font-size:48px;
                letter-spacing:1px;
            }

            .hero h2 {
                font-size:23px;
                letter-spacing:0;
                line-height:1.65;
            }

            .hero p {
                font-size:16px;
                line-height:2;
            }

            .facebook-box {
                padding:0;
            }

            .facebook-custom-card {
                padding:18px 16px;
                border-radius:14px;
            }

            .facebook-custom-message {
                font-size:15px;
            }

            .contact-box {
                min-height:260px;
                padding:40px 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="nav">
            <a href="#" class="logo">
                好運研究所
                <span>GOOD LUCK RESEARCH</span>
            </a>

            <div class="nav-links">
                <a href="#rooms">研究室</a>
                <a href="#about">關於小盧老師</a>
                <a href="#content">內容／媒體</a>
                <a href="services.html">服務方案</a>
                <a href="#facebook">Facebook</a>
                <a href="#contact">聯絡</a>
            </div>
        </nav>
    </header>

    <section class="hero">

        <img
            src="uploads/hero-oriental-main.png"
            alt="好運研究所主視覺"
            class="hero-mobile-image"
        >

        <div class="hero-inner">

            <div class="hero-text">

                <span class="eyebrow">
                    GOOD LUCK RESEARCH
                </span>

                <h1>
                    好運研究所
                </h1>

                <h2>
                    找到生活裡的好運，<br>
                    也找到自己的答案。
                </h2>

                <p>
                    歡迎來到好運研究所。
                    這裡談占卜、風水、財運，
                    也談生活裡那些關於選擇、機會、
                    人與人生的故事。
                </p>

                <div class="hero-buttons">
                    <a href="#rooms" class="btn btn-primary">
                        探索好運研究所
                    </a>

                    <a href="#about" class="btn btn-outline">
                        認識小盧老師
                    </a>

                    <a href="services.html" class="btn btn-outline">
                        查看服務方案
                    </a>
                </div>

            </div>

            <div class="hero-card">
                <div class="hero-symbol">
                    <div class="circle">🔮</div>
                    <h3>看見更多可能</h3>
                    <p>不急著替你決定答案</p>
                </div>
            </div>

        </div>
    </section>


    <section class="rooms" id="rooms">

        <div class="section-inner">

            <div class="section-title">
                <small>EXPLORE</small>
                <h2>我們的服務</h2>
            </div>

            <div class="room-grid">

                <a href="fortune.html" class="room-card">
                    <img src="uploads/fortune.png" alt="占卜研究室" class="room-image">
                    <div class="room
