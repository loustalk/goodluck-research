<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>好運研究所｜占卜・風水・財運・生活好運</title>

    <meta name="description" content="好運研究所｜由小盧老師主持，分享占卜、風水、財運分析，以及故事、Podcast、YouTube與生活裡關於好運的觀察。">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            background: #faf8f3;
            color: #333;
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 導覽列 */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(250, 248, 243, 0.96);
            border-bottom: 1px solid #e8e0d2;
            backdrop-filter: blur(10px);
        }

        .nav {
            max-width: 1180px;
            margin: auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #7a5735;
            white-space: nowrap;
        }

        .logo span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 3px;
            color: #a08a70;
            margin-top: -5px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
            font-size: 14px;
        }

        .nav-links a {
            color: #5d554c;
            transition: 0.25s;
        }

        .nav-links a:hover {
            color: #a66f32;
        }

        /* 首頁主視覺 */
        .hero {
            min-height: 680px;
            padding: 90px 24px 100px;
            display: flex;
            align-items: center;
            background:
                radial-gradient(circle at 80% 20%, rgba(210, 174, 112, 0.22), transparent 28%),
                radial-gradient(circle at 20% 80%, rgba(184, 148, 91, 0.10), transparent 30%),
                #faf8f3;
        }

        .hero-inner {
            max-width: 1180px;
            width: 100%;
            margin: auto;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 70px;
            align-items: center;
        }

        .hero-text .eyebrow {
            display: inline-block;
            margin-bottom: 18px;
            padding: 6px 15px;
            border: 1px solid #d9c4a4;
            border-radius: 30px;
            color: #987044;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .hero h1 {
            font-size: clamp(44px, 7vw, 78px);
            line-height: 1.15;
            letter-spacing: 7px;
            color: #68482d;
            margin-bottom: 20px;
        }

        .hero h2 {
            font-size: clamp(21px, 3vw, 30px);
            font-weight: 500;
            color: #51473e;
            margin-bottom: 25px;
        }

        .hero p {
            max-width: 650px;
            color: #70685f;
            font-size: 16px;
        }

        .hero-buttons {
            margin-top: 35px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            transition: 0.25s;
        }

        .btn-primary {
            background: #87613b;
            color: white;
        }

        .btn-primary:hover {
            background: #68482d;
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 1px solid #cbb99e;
            color: #755839;
            background: rgba(255,255,255,0.45);
        }

        .btn-outline:hover {
            background: white;
        }

        /* 主視覺右側 */
        .hero-card {
            position: relative;
            min-height: 390px;
            border-radius: 28px;
            padding: 45px;
            background: linear-gradient(145deg, #eee2cf, #f8f4ec);
            border: 1px solid #dfd0b9;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(80, 57, 34, 0.08);
        }

        .hero-symbol {
            text-align: center;
        }

        .hero-symbol .circle {
            width: 190px;
            height: 190px;
            margin: auto auto 25px;
            border: 1px solid #b99463;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            background: rgba(255,255,255,0.35);
        }

        .hero-symbol h3 {
            color: #765332;
            font-size: 22px;
            letter-spacing: 4px;
        }

        .hero-symbol p {
            margin-top: 5px;
            font-size: 13px;
            color: #97836d;
        }

        /* 共用區塊標題 */
        .section-inner {
            max-width: 1080px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title small {
            display: block;
            color: #a07b50;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .section-title h2 {
            font-size: 32px;
            color: #62472f;
            letter-spacing: 3px;
        }

        /* 六大入口 */
        .rooms {
            padding: 100px 24px;
            background: #faf8f3;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .room-card {
            min-height: 245px;
            padding: 32px;
            background: white;
            border: 1px solid #e7ddd0;
            border-radius: 20px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .room-card::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            right: -40px;
            bottom: -40px;
            border-radius: 50%;
            background: #f1e6d5;
        }

        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(75, 54, 33, 0.09);
        }

        .room-icon {
            font-size: 35px;
            margin-bottom: 14px;
        }

        .room-card h3 {
            font-size: 21px;
            color: #694b31;
            margin-bottom: 10px;
        }

        .room-card p {
            font-size: 14px;
            color: #81776d;
        }

        .room-card .arrow {
            position: absolute;
            right: 25px;
            bottom: 20px;
            color: #b18b5d;
            font-size: 20px;
        }

        /* 關於小盧老師 */
        .about {
            padding: 100px 24px;
            background: #eee7dc;
        }

        .about-inner {
            max-width: 1050px;
            margin: auto;
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 65px;
            align-items: center;
        }

        .about-image {
            min-height: 390px;
            border-radius: 25px;
            background: linear-gradient(145deg, #d9c5a7, #eee6d8);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #d2bea1;
        }

        .about-image div {
            text-align: center;
            color: #7b5a39;
        }

        .about-image .placeholder {
            font-size: 58px;
            margin-bottom: 15px;
        }

        .about-image p {
            font-size: 13px;
        }

        .about-text small {
            color: #a07748;
            letter-spacing: 3px;
        }

        .about-text h2 {
            font-size: 34px;
            color: #61452e;
            margin: 10px 0 22px;
        }

        .about-text p {
            color: #6f665d;
            margin-bottom: 15px;
        }

        /* 品牌主張獨立呈現 */
        .about-text .about-slogan {
            margin-top: 30px;
            padding: 24px 0 0;
            border-top: 1px solid #d2bea1;
            color: #68482d;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.9;
        }

        .about-text .about-slogan strong {
            display: block;
            margin-top: 8px;
            color: #a07748;
            font-size: 25px;
            font-weight: 700;
        }

        /* 內容與媒體 */
        .content-section {
            padding: 100px 24px;
            background: #faf8f3;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .content-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #e5dbce;
        }

        .content-link {
            display: block;
            color: inherit;
            transition: 0.3s;
        }

        .content-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(75, 54, 33, 0.09);
        }

        .content-image {
            height: 175px;
            background: linear-gradient(135deg, #e8dac3, #f5f0e8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .content-body {
            padding: 24px;
        }

        .content-body small {
            color: #a47b4d;
        }

        .content-body h3 {
            margin: 7px 0 10px;
            color: #674a31;
            font-size: 19px;
        }

        .content-body p {
            color: #817970;
            font-size: 14px;
        }

        /* Facebook 最新貼文 */
        .facebook-section {
            background: #f0ebe2;
            padding: 70px 24px;
        }

        .facebook-box {
            width: 100%;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0;
            text-align: center;
            box-shadow: none;
        }

            display: block;
            margin-bottom
