name: 更新 Facebook 最新貼文

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 取得 Facebook 最新貼文
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          PAGE_ID="1162786317464622"
          OUTPUT="data/facebook-latest.json"

          RESPONSE=$(curl --http1.1 -sS --fail-with-body \
            "https://graph.facebook.com/v26.0/me/posts?fields=id,message,created_time,permalink_url&limit=3&access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}")

          echo "$RESPONSE" > /tmp/facebook-response.json

          if ! jq -e '.data and (.data | type == "array")' /tmp/facebook-response.json > /dev/null; then
            echo "Facebook API 回傳錯誤："
            cat /tmp/facebook-response.json
            exit 1
          fi

          jq --arg page_id "$PAGE_ID" '
            {
              page: {
                name: "觀音之光神諭卡占卜工作室"
              },
              posts: [
                .data[] |
                {
                  id: .id,
                  message: (.message // ""),
                  created_time: .created_time,
                  permalink_url: .permalink_url
                }
              ]
            }
          ' /tmp/facebook-response.json > /tmp/facebook-latest.json

          mkdir -p data
          cp /tmp/facebook-latest.json "$OUTPUT"

          echo "更新完成："
          cat "$OUTPUT"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/facebook-latest.json

          if git diff --cached --quiet; then
            echo "沒有新的 Facebook 貼文資料需要更新"
          else
            git commit -m "更新 Facebook 最新貼文"
            git push
          fi
