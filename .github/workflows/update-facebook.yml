name: 更新 Facebook 最新貼文

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 取得 Facebook 最新貼文
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -e

          PAGE_ID="1162786317464622"

          RESPONSE=$(curl -sS \
            "https://graph.facebook.com/v26.0/me/posts?fields=id,message,created_time,permalink_url,from,target,parent_id,via,type,status_type,object_id,is_published,is_hidden,privacy&limit=3&access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}")

          echo "$RESPONSE" > /tmp/facebook-response.json

          if ! echo "$RESPONSE" | jq -e '.data' > /dev/null; then
            echo "Facebook API 回傳錯誤："
            cat /tmp/facebook-response.json
            exit 1
          fi

          jq --arg page_id "$PAGE_ID" '
            {
              page: {
                name: "觀音之光神諭卡占卜工作室"
              },
              posts: [
                .data[] |
                {
                  id: .id,
                  message: (.message // ""),
                  created_time: .created_time,
                  permalink_url: .permalink_url,

                  embed_url: (
                    "https://www.facebook.com/permalink.php?story_fbid="
                    + (
                        .id
                        | split("_")
                        | .[1]
                      )
                    + "&id="
                    + $page_id
                  ),

                  diagnostics: {
                    from: (.from // null),
                    target: (.target // null),
                    parent_id: (.parent_id // null),
                    via: (.via // null),
                    type: (.type // null),
                    status_type: (.status_type // null),
                    object_id: (.object_id // null),
                    is_published: (.is_published // null),
                    is_hidden: (.is_hidden // null),
                    privacy: (.privacy // null)
                  }
                }
              ]
            }
          ' /tmp/facebook-response.json > data/facebook-latest.json

          echo "======================================"
          echo "Facebook 最新貼文資料（含診斷欄位）"
          echo "======================================"

          cat data/facebook-latest.json

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/facebook-latest.json

          if git diff --cached --quiet; then
            echo "沒有新的 Facebook 貼文資料需要更新"
          else
            git commit -m "更新 Facebook 最新貼文診斷資料"
            git push
          fi
