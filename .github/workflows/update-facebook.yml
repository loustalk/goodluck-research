name: 更新 Facebook 最新貼文

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 取得 Facebook 最新貼文
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -e

          PAGE_ID="1162786317464622"

          RESPONSE=$(curl -sS \
            "https://graph.facebook.com/v26.0/me/posts?fields=id,message,created_time,permalink_url,from,parent_id,via,status_type,is_published,is_hidden,privacy,target&limit=3&access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}")

          echo "$RESPONSE" > /tmp/facebook-response.json

          if ! echo "$RESPONSE" | jq -e '.data' > /dev/null; then
            echo "Facebook API 回傳錯誤："
            cat /tmp/facebook-response.json
            exit 1
          fi

          echo "======================================"
          echo "開始取得 Facebook 每篇貼文的實際高度"
          echo "======================================"

          jq --arg page_id "$PAGE_ID" '
            {
              page: {
                name: "觀音之光神諭卡占卜工作室"
              },
              posts: [
                .data[] |
                {
                  id: .id,
                  message: (.message // ""),
                  created_time: .created_time,
                  permalink_url: .permalink_url,

                  embed_url: (
                    "https://www.facebook.com/permalink.php?story_fbid="
                    + (
                        .id
                        | split("_")
                        | .[1]
                      )
                    + "&id="
                    + $page_id
                  ),

                  diagnostics: {
                    from: (.from // null),
                    parent_id: (.parent_id // null),
                    via: (.via // null),
                    status_type: (.status_type // null),
                    is_published: (.is_published // null),
                    is_hidden: (.is_hidden // null),
                    privacy: (.privacy // null),
                    target: (.target // null)
                  }
                }
              ]
            }
          ' /tmp/facebook-response.json > /tmp/facebook-base.json

          jq -c '.posts[]' /tmp/facebook-base.json | while read -r POST; do

            POST_ID=$(echo "$POST" | jq -r '.id')
            POST_URL=$(echo "$POST" | jq -r '.permalink_url')

            echo ""
            echo "--------------------------------------"
            echo "貼文：${POST_ID}"
            echo "網址：${POST_URL}"

            OEMBED=$(curl -sS \
              --get \
              --data-urlencode "url=${POST_URL}" \
              --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
              "https://graph.facebook.com/v26.0/oembed_post")

            echo "$OEMBED" > /tmp/facebook-oembed.json

            HEIGHT=$(echo "$OEMBED" | jq -r '.height // empty' 2>/dev/null || true)

            if [ -n "$HEIGHT" ] && [ "$HEIGHT" != "null" ]; then
              echo "Facebook 回傳高度：${HEIGHT}px"
            else
              echo "Facebook 沒有回傳高度，使用預設高度 1200px"
              HEIGHT="1200"
            fi

            jq \
              --arg id "$POST_ID" \
              --argjson height "$HEIGHT" \
              '
                .posts |= map(
                  if .id == $id
                  then . + {height: $height}
                  else .
                  end
                )
              ' \
              /tmp/facebook-base.json > /tmp/facebook-updated.json

            mv /tmp/facebook-updated.json /tmp/facebook-base.json

          done

          cp /tmp/facebook-base.json data/facebook-latest.json

          echo ""
          echo "======================================"
          echo "Facebook 最新貼文資料"
          echo "======================================"

          cat data/facebook-latest.json


      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/facebook-latest.json

          if git diff --cached --quiet; then
            echo "沒有新的 Facebook 貼文資料需要更新"
          else
            git commit -m "更新 Facebook 貼文實際高度"
            git push
          fi
