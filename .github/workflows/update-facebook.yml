
name: 更新 Facebook 最新貼文

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 取得 Facebook 最新貼文
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          PAGE_ID="116278631764622"
          OUTPUT="data/facebook-latest.json"
          RESPONSE_FILE="/tmp/facebook-response.json"

          if [ -z "${FACEBOOK_PAGE_ACCESS_TOKEN:-}" ]; then
            echo "錯誤：未設定 FACEBOOK_PAGE_ACCESS_TOKEN"
            exit 1
          fi

          echo "開始取得 Facebook 專頁最新貼文..."
          echo "專頁 ID：${PAGE_ID}"

          if ! HTTP_STATUS=$(curl \
            --http1.1 \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 180 \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --get \
            --data-urlencode "fields=id,message,created_time,permalink_url" \
            --data-urlencode "limit=3" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/posts"); then
            echo "錯誤：連線失敗，或 curl 無法完成請求。"
            exit 1
          fi

          echo "Facebook API HTTP 狀態碼：${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Facebook API 請求失敗，錯誤內容如下："

            if jq -e . "$RESPONSE_FILE" >/dev/null 2>&1; then
              jq 'if .error then .error else . end' "$RESPONSE_FILE"
            else
              cat "$RESPONSE_FILE"
            fi

            exit 1
          fi

          if ! jq -e '.data and (.data | type == "array")' \
            "$RESPONSE_FILE" >/dev/null; then
            echo "錯誤：Facebook API 回傳格式不正確。"
            jq 'if .error then .error else . end' "$RESPONSE_FILE"
            exit 1
          fi

          jq --arg page_id "$PAGE_ID" '
            {
              page: {
                id: $page_id,
                name: "觀音之光神諭卡占卜工作室"
              },
              posts: [
                .data[] |
                {
                  id: .id,
                  message: (.message // ""),
                  created_time: .created_time,
                  permalink_url: .permalink_url
                }
              ]
            }
          ' "$RESPONSE_FILE" > /tmp/facebook-latest.json

          jq -e '.posts and (.posts | type == "array")' \
            /tmp/facebook-latest.json >/dev/null

          mkdir -p data
          cp /tmp/facebook-latest.json "$OUTPUT"

          echo "更新完成，取得貼文數量："
          jq '.posts | length' "$OUTPUT"

      - name: Commit and Push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/facebook-latest.json

          if git diff --cached --quiet; then
            echo "沒有新的 Facebook 貼文資料需要更新"
          else
            git commit -m "更新 Facebook 最新貼文"
            git pull --rebase origin main
            git push
          fi
