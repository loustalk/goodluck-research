
name: 更新 Facebook 最新貼文

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 取得 Facebook 最新貼文
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          PAGE_ID="1162786317464622"
          OUTPUT="data/facebook-latest.json"

          if [ -z "${FACEBOOK_PAGE_ACCESS_TOKEN:-}" ]; then
            echo "錯誤：未設定 FACEBOOK_PAGE_ACCESS_TOKEN"
            exit 1
          fi

          # 連線失敗時重試，並設定逾時
          RESPONSE=$(curl --http1.1 --silent --show-error --fail-with-body \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 180 \
            --get \
            --data-urlencode "fields=id,message,created_time,permalink_url" \
            --data-urlencode "limit=3" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            "https://graph.facebook.com/v26.0/me/posts")

          printf '%s\n' "$RESPONSE" > /tmp/facebook-response.json

          # 確認 Facebook API 回傳有效資料
          if ! jq -e '.data and (.data | type == "array")' \
            /tmp/facebook-response.json > /dev/null; then
            echo "Facebook API 回傳錯誤或資料格式不正確："
            jq 'if .error then .error else . end' \
              /tmp/facebook-response.json
            exit 1
          fi

          # 先產生暫存檔，驗證成功後才更新正式資料
          jq --arg page_id "$PAGE_ID" '
            {
              page: {
                name: "觀音之光神諭卡占卜工作室"
              },
              posts: [
                .data[] |
                {
                  id: .id,
                  message: (.message // ""),
                  created_time: .created_time,
                  permalink_url: .permalink_url
                }
              ]
            }
          ' /tmp/facebook-response.json > /tmp/facebook-latest.json

          jq -e '.posts and (.posts | type == "array")' \
            /tmp/facebook-latest.json > /dev/null

          mkdir -p data
          cp /tmp/facebook-latest.json "$OUTPUT"

          echo "更新完成，取得貼文數量："
          jq '.posts | length' "$OUTPUT"

      - name: Commit and Push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/facebook-latest.json

          if git diff --cached --quiet; then
            echo "沒有新的 Facebook 貼文資料需要更新"
          else
            git commit -m "更新 Facebook 最新貼文"
            git push
          fi
