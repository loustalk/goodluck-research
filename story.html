<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <title>好運研究所｜占卜桌上的故事</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f3e6dc;
            --card: #fffaf6;
            --text: #76513f;
            --subtext: #8c6c5b;
            --line: #e6cbb9;

            --rose-gold: #a86e53;
            --rose-light: #f0d9ca;

            --gold-bg: #fbf2e4;
            --gold-line: #ead7b7;
            --gold-text: #a17a43;

            --brown-dark: #5f4030;
            --white: #fffaf6;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            background: var(--bg);
            color: var(--text);

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            line-height: 1.9;
        }

        a {
            color: inherit;
        }

        .container {
            width: min(1180px, calc(100% - 48px));
            margin: 0 auto;
        }


        /* ==================================================
           HERO
        ================================================== */

        .hero {
            position: relative;
            min-height: 650px;

            display: flex;
            align-items: center;

            overflow: hidden;

            background: var(--bg);

            border-bottom:
                1px solid rgba(230, 203, 185, 0.8);
        }

        .hero-image {
            position: absolute;
            inset: 0;

            z-index: 0;

            overflow: hidden;
        }

        .hero-image img {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
            object-position: center center;
        }

        /*
         * 左側文字區域保持柔和留白。
         * 右側保留完整占卜桌場景。
         */

        .hero::after {
            content: "";

            position: absolute;
            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    rgba(243, 230, 220, 0.98) 0%,
                    rgba(243, 230, 220, 0.94) 25%,
                    rgba(243, 230, 220, 0.72) 40%,
                    rgba(243, 230, 220, 0.30) 58%,
                    rgba(243, 230, 220, 0.03) 78%,
                    rgba(243, 230, 220, 0) 100%
                );
        }

        .hero-inner {
            position: relative;

            z-index: 2;

            width: min(1180px, calc(100% - 48px));

            margin: 0 auto;

            padding: 90px 0 100px;
        }

        .hero-copy {
            width: min(560px, 50%);
        }

        .hero-eyebrow {
            display: inline-block;

            margin-bottom: 18px;

            color: var(--gold-text);

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        .hero h1 {
            margin: 0 0 20px;

            color: var(--brown-dark);

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            font-size: clamp(52px, 6vw, 78px);

            font-weight: 800;

            line-height: 1.2;

            letter-spacing: 3px;

            -webkit-text-stroke: 0;

            paint-order: normal;
        }

        .hero-decoration {
            width: 120px;
            height: 1px;

            margin: 22px 0;

            background:
                linear-gradient(
                    90deg,
                    var(--gold-text),
                    rgba(161, 122, 67, 0)
                );
        }

        .hero-subtitle {
            margin: 0 0 22px;

            color: var(--rose-gold);

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            font-size: clamp(25px, 3vw, 34px);

            font-weight: 700;

            line-height: 1.55;

            letter-spacing: 2px;

            -webkit-text-stroke: 0;

            paint-order: normal;
        }

        .hero-description {
            max-width: 510px;

            margin: 0 0 30px;

            color: #684c3b;

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            font-size: 16px;

            font-weight: 500;

            line-height: 2;
        }

        .back-home {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            color: var(--rose-gold);

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",

            font-size: 14px;

            font-weight: 500;

           STORY SECTION
        ================================================== */

            text-align: center;

        .section-eyebrow {

            color: var(--gold-text);

            font-family:

                "Microsoft JhengHei",
                sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 4px;

            text-transform: uppercase;
        }

        .section-heading h2 {
            margin: 0;

            font-family:
                "Noto Sans TC",

            font-size: 36px;

            font-weight: 700;

        }

        /* ==================================================
           STORY LIST
        ================================================== */

        }

        /*
         * 淡淡的東方框角裝飾

            content: "";

            right: 20px;

            height: 48px;

        .story-card::after {

            position: absolute;

            left: 20px;

            border-left:

            transform: translateY(-4px);

            z-index: 1;

            font-family:

            font-weight: 400;

            display: -webkit-box;

            -webkit-box-orient: vertical;

            -webkit-line-clamp: 4;

            overflow: hidden;
        }

        .read-more {
            position: relative;

            z-index: 1;

            align-self: flex-start;

            margin-top: auto;

            padding-top: 24px;

            color: var(--rose-gold);

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",

            font-size: 14px;

            letter-spacing: 1px;

<script>

const API_URL =
    "https://api.github.com/repos/loustalk/goodluck-research/contents/content/articles?ref=main";

const RAW_BASE =
    "https://raw.githubusercontent.com/loustalk/goodluck-research/main/content/articles/";



/* ==================================================
   Front Matter
================================================== */

function parseFrontMatter(text) {

    const result = {
        title: "",
        date: "",
        category: "",
        body: text
    };


    if (!text.startsWith("---")) {
        return result;
    }


    const end =
        text.indexOf("\n---", 3);


    if (end === -1) {
        return result;
    }


    const frontMatter =
        text.substring(
            3,
            end
        ).trim();


    result.body =
        text.substring(
            end + 4
        ).trim();


    frontMatter
        .split("\n")
        .forEach(line => {

            const colon =
                line.indexOf(":");


            if (colon === -1) {
                return;
            }


            const key =
                line.substring(
                    0,
                    colon
                ).trim();


            let value =
                line.substring(
                    colon + 1
                ).trim();


            value =
                value.replace(
                    /^["']|["']$/g,
                    ""
                );


            if (key === "title") {
                result.title = value;
            }


            if (key === "date") {
                result.date = value;
            }


            if (key === "category") {
                result.category = value;
            }

        });


    return result;
}



/* ==================================================
   日期格式
================================================== */

function formatDate(dateString) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {
        return dateString;
    }


    return date.toLocaleDateString(
        "zh-TW",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    );
}



/* ==================================================
   HTML Escape
================================================== */

function escapeHtml(text) {

    return String(text || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}



/* ==================================================
   Markdown → HTML
================================================== */

function markdownToHtml(markdown) {

    const images = [];


    /*
     * 先保留 CMS 插入的圖片
     */

    let text =
        markdown.replace(
            /<img\s+[^>]*>/gi,
            function(match) {

                const index =
                    images.length;


                images.push(match);


                return `___IMAGE_${index}___`;

            }
        );


    text =
        escapeHtml(text);


    /*
     * Markdown 標題
     */

    text =
        text.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );


    text =
        text.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );


    text =
        text.replace(
            /^# (.*)$/gm,
            "<h2>$1</h2>"
        );


    /*
     * 粗體
     */

    text =
        text.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    /*
     * 斜體
     */

    text =
        text.replace(
            /\*(.*?)\*/g,
            "<em>$1</em>"
        );


    /*
     * 空白行 → 段落
     */

    const blocks =
        text
            .split(/\n\s*\n/)
            .map(
                block =>
                    block.trim()
            )
            .filter(Boolean);


    text =
        blocks
            .map(block => {

                if (
                    block.startsWith("<h2>") ||
                    block.startsWith("<h3>")
                ) {
                    return block;
                }


                if (
                    block.startsWith(
                        "___IMAGE_"
                    )
                ) {
                    return block;
                }


                return (
                    "<p>" +
                    block.replace(
                        /\n/g,
                        "<br>"
                    ) +
                    "</p>"
                );

            })
            .join("\n");


    /*
     * 圖片放回去
     */

    images.forEach(
        (image, index) => {

            text =
                text.replace(
                    new RegExp(
                        `___IMAGE_${index}___`,
                        "g"
                    ),
                    image
                );

        }
    );


    return text;
}



/* ==================================================
   摘要
================================================== */

function createExcerpt(markdown) {

    let text =
        markdown
            .replace(
                /<img\s+[^>]*>/gi,
                ""
            )
            .replace(
                /[#*_]/g,
                ""
            )
            .replace(
                /\n+/g,
                " "
            )
            .trim();


    if (text.length > 135) {

        text =
            text.substring(
                0,
                135
            ) + "……";

    }


    return text;
}



/* ==================================================
   載入文章
================================================== */

async function loadStories() {

    const storyList =
        document.getElementById(
            "storyList"
        );


    try {

        const response =
            await fetch(
                API_URL +
                "&t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "GitHub API 讀取失敗"
            );

        }


        const files =
            await response.json();


        const markdownFiles =
            files.filter(
                file =>
                    file.name
                        .toLowerCase()
                        .endsWith(".md")
            );


        const articles = [];


        for (
            const file
            of markdownFiles
        ) {

            try {

                const rawUrl =
                    RAW_BASE +
                    encodeURIComponent(
                        file.name
                    );


                const articleResponse =
                    await fetch(
                        rawUrl +
                        "?t=" +
                        Date.now(),
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (
                    !articleResponse.ok
                ) {
                    continue;
                }


                const text =
                    await articleResponse.text();


                const article =
                    parseFrontMatter(
                        text
                    );


                /*
                 * 只抓 category: story
                 */

                if (
                    article.category !==
                    "story"
                ) {
                    continue;
                }


                article.filename =
                    file.name;


                articles.push(
                    article
                );

            } catch (error) {

                console.warn(
                    "文章讀取失敗：",
                    file.name,
                    error
                );

            }

        }


        /*
         * 最新文章排最前面
         */

        articles.sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );


        if (
            articles.length === 0
        ) {

            storyList.innerHTML = `

                <div class="empty">
                    目前還沒有故事。
                </div>

            `;

            return;
        }


        /*
         * 建立故事卡片
         */

        storyList.innerHTML =
            articles
                .map(
                    (article, index) => {

                        return `

                            <article
                                class="story-card"
                            >

                                <h2
                                    class="story-card-title"
                                >
                                    ${escapeHtml(
                                        article.title ||
                                        "未命名故事"
                                    )}
                                </h2>


                                <div
                                    class="story-date"
                                >
                                    ${formatDate(
                                        article.date
                                    )}
                                </div>


                                <div
                                    class="story-excerpt"
                                >
                                    ${escapeHtml(
                                        createExcerpt(
                                            article.body
                                        )
                                    )}
                                </div>


                                <a
                                    href="#story-${index}"
                                    class="read-more"
                                    data-index="${index}"
                                >
                                    閱讀全文 →
                                </a>

                            </article>

                        `;

                    }
                )
                .join("");


        /*
         * 綁定閱讀按鈕
         */

        document
            .querySelectorAll(
                ".read-more"
            )
            .forEach(
                link => {

                    link.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();


                            const index =
                                Number(
                                    this.dataset
                                        .index
                                );


                            showArticle(
                                articles[index]
                            );

                        }
                    );

                }
            );

    } catch (error) {

        console.error(error);


        storyList.innerHTML = `

            <div class="error">
                故事載入失敗，請稍後再試。
            </div>

        `;
    }
}



/* ==================================================
   顯示單篇文章
================================================== */

function showArticle(article) {

    const storyListSection =
        document.getElementById(
            "storyListSection"
        );


    const articleView =
        document.getElementById(
            "articleView"
        );


    storyListSection.style.display =
        "none";


    articleView.style.display =
        "block";


    articleView.innerHTML = `

        <div class="container">

            <article class="article">

                <div
                    class="article-topline"
                ></div>


                <h1>
                    ${escapeHtml(
                        article.title ||
                        "未命名故事"
                    )}
                </h1>


                <div
                    class="article-date"
                >
                    ${formatDate(
                        article.date
                    )}
                </div>


                <div
                    class="article-body"
                >
                    ${markdownToHtml(
                        article.body
                    )}
                </div>

            </article>


            <div
                class="article-navigation"
            >

                <a
                    href="#"
                    id="backToList"
                >
                    ← 返回故事列表
                </a>

            </div>

        </div>
    `;


    document
        .getElementById(
            "backToList"
        )
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                articleView.style.display =
                    "none";


                storyListSection.style.display =
                    "block";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}



/* ==================================================
   啟動
================================================== */

loadStories();

</script>
