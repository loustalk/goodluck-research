<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>好運研究所｜占卜桌上的故事</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;
            background: #f7f4ef;
            color: #333;
            line-height: 1.9;
        }

        .container {
            width: min(1000px, 92%);
            margin: 0 auto;
        }

        header {
            padding: 70px 20px 45px;
            text-align: center;
            background: #eee8de;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 36px;
            letter-spacing: 2px;
        }

        header p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #765c42;
            text-decoration: none;
            font-size: 15px;
        }

        .back:hover {
            text-decoration: underline;
        }

        main {
            padding: 55px 0 80px;
        }

        /* 文章列表 */

        .story-list {
            display: grid;
            gap: 24px;
        }

        .story-card {
            background: #fff;
            border-radius: 14px;
            padding: 28px 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .story-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .story-card h2 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #4b4036;
        }

        .story-date {
            margin-bottom: 15px;
            color: #999;
            font-size: 14px;
        }

        .story-excerpt {
            color: #666;
            font-size: 16px;
            line-height: 1.9;
        }

        .read-more {
            display: inline-block;
            margin-top: 18px;
            padding: 8px 18px;
            border: 1px solid #8a745d;
            border-radius: 20px;
            color: #6d5947;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .read-more:hover {
            background: #6d5947;
            color: #fff;
        }

        /* 單篇文章 */

        .article {
            background: #fff;
            border-radius: 14px;
            padding: 45px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
        }

        .article h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 32px;
            color: #4b4036;
        }

        .article-date {
            color: #999;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .article-body {
            font-size: 17px;
            line-height: 2;
            color: #444;
        }

        .article-body p {
            margin: 0 0 1.5em;
        }

        .article-body h2,
        .article-body h3 {
            margin-top: 2em;
            margin-bottom: 0.8em;
            color: #4b4036;
        }

        .article-body strong {
            color: #5c4937;
        }

        .article-body img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 25px auto;
        }

        .article-navigation {
            margin-top: 30px;
            text-align: center;
        }

        .article-navigation a {
            color: #765c42;
            text-decoration: none;
        }

        .article-navigation a:hover {
            text-decoration: underline;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 50px 20px;
            color: #888;
        }

        .error {
            color: #a55;
        }

        @media (max-width: 700px) {

            header {
                padding: 50px 18px 35px;
            }

            header h1 {
                font-size: 29px;
            }

            main {
                padding: 35px 0 60px;
            }

            .story-card {
                padding: 22px;
            }

            .story-card h2 {
                font-size: 21px;
            }

            .article {
                padding: 25px 20px;
            }

            .article h2 {
                font-size: 26px;
            }

            .article-body {
                font-size: 16px;
                line-height: 1.9;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <h1>📖 占卜桌上的故事</h1>

        <p>
            從一張占卜桌，看見人、選擇、因果與人生。
        </p>

        <a class="back" href="index.html">
            ← 回到好運研究所
        </a>
    </div>
</header>

<main>
    <div class="container">

        <!-- 文章列表 -->
        <section id="storyList" class="story-list">
            <div class="loading">
                正在整理占卜桌上的故事……
            </div>
        </section>

        <!-- 單篇文章 -->
        <section id="articleView" style="display:none;">
        </section>

    </div>
</main>

<script>

const API_URL =
    "https://api.github.com/repos/loustalk/goodluck-research/contents/content/articles?ref=main";

const RAW_BASE =
    "https://raw.githubusercontent.com/loustalk/goodluck-research/main/content/articles/";


/* =========================
   Front Matter
========================= */

function parseFrontMatter(text) {

    const result = {
        title: "",
        date: "",
        category: "",
        body: text
    };

    if (!text.startsWith("---")) {
        return result;
    }

    const end = text.indexOf("\n---", 3);

    if (end === -1) {
        return result;
    }

    const frontMatter = text.substring(3, end).trim();

    result.body = text.substring(end + 4).trim();

    frontMatter.split("\n").forEach(line => {

        const colon = line.indexOf(":");

        if (colon === -1) return;

        const key = line.substring(0, colon).trim();

        let value = line.substring(colon + 1).trim();

        value = value.replace(/^["']|["']$/g, "");

        if (key === "title") {
            result.title = value;
        }

        if (key === "date") {
            result.date = value;
        }

        if (key === "category") {
            result.category = value;
        }
    });

    return result;
}


/* =========================
   日期格式
========================= */

function formatDate(dateString) {

    if (!dateString) {
        return "";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
        return dateString;
    }

    return date.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });
}


/* =========================
   HTML Escape
========================= */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   Markdown → HTML
   保留 CMS 圖片
========================= */

function markdownToHtml(markdown) {

    const images = [];

    /*
     * 先把 CMS 插入的 img 抓出來
     * 避免後面的 HTML escape 把圖片變成文字
     */

    let text = markdown.replace(
        /<img\s+[^>]*>/gi,
        function(match) {

            const index = images.length;

            images.push(match);

            return `___IMAGE_${index}___`;
        }
    );


    text = escapeHtml(text);


    /*
     * 基本 Markdown
     */

    text = text.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );

    text = text.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
    );

    text = text.replace(
        /^# (.*)$/gm,
        "<h2>$1</h2>"
    );

    text = text.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    text = text.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );


    /*
     * 空白行 → 段落
     */

    const blocks = text
        .split(/\n\s*\n/)
        .map(block => block.trim())
        .filter(Boolean);


    text = blocks.map(block => {

        if (
            block.startsWith("<h2>") ||
            block.startsWith("<h3>")
        ) {
            return block;
        }

        if (block.startsWith("___IMAGE_")) {
            return block;
        }

        return "<p>" +
            block.replace(/\n/g, "<br>") +
            "</p>";

    }).join("\n");


    /*
     * 把圖片放回去
     */

    images.forEach((image, index) => {

        text = text.replace(
            new RegExp(`___IMAGE_${index}___`, "g"),
            image
        );

    });


    return text;
}


/* =========================
   摘要
========================= */

function createExcerpt(markdown) {

    let text = markdown
        .replace(/<img\s+[^>]*>/gi, "")
        .replace(/[#*_]/g, "")
        .replace(/\n+/g, " ")
        .trim();

    if (text.length > 120) {
        text = text.substring(0, 120) + "……";
    }

    return text;
}


/* =========================
   載入文章
========================= */

async function loadStories() {

    const storyList = document.getElementById("storyList");
    const articleView = document.getElementById("articleView");

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("GitHub API 讀取失敗");
        }

        const files = await response.json();


        const markdownFiles = files.filter(file =>
            file.name.toLowerCase().endsWith(".md")
        );


        const articles = [];


        for (const file of markdownFiles) {

            try {

                const rawUrl =
                    RAW_BASE + encodeURIComponent(file.name);

                const articleResponse =
                    await fetch(rawUrl);

                if (!articleResponse.ok) {
                    continue;
                }

                const text =
                    await articleResponse.text();

                const article =
                    parseFrontMatter(text);

                /*
                 * 只抓「占卜桌上的故事」
                 */

                if (article.category !== "story") {
                    continue;
                }

                article.filename = file.name;

                articles.push(article);

            } catch (error) {

                console.warn(
                    "文章讀取失敗：",
                    file.name,
                    error
                );

            }
        }


        /*
         * 最新文章排最前面
         */

        articles.sort((a, b) =>
            new Date(b.date) - new Date(a.date)
        );


        if (articles.length === 0) {

            storyList.innerHTML = `
                <div class="empty">
                    目前還沒有故事。
                </div>
            `;

            return;
        }


        /*
         * 建立文章列表
         */

        storyList.innerHTML = articles.map(
            (article, index) => {

                return `
                    <article class="story-card">

                        <h2>
                            ${escapeHtml(article.title || "未命名故事")}
                        </h2>

                        <div class="story-date">
                            ${formatDate(article.date)}
                        </div>

                        <div class="story-excerpt">
                            ${escapeHtml(
                                createExcerpt(article.body)
                            )}
                        </div>

                        <a
                            href="#story-${index}"
                            class="read-more"
                            data-index="${index}"
                        >
                            閱讀全文 →
                        </a>

                    </article>
                `;

            }
        ).join("");


        /*
         * 綁定閱讀按鈕
         */

        document.querySelectorAll(".read-more")
            .forEach(link => {

                link.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        const index =
                            Number(this.dataset.index);

                        showArticle(
                            articles[index]
                        );

                    }
                );

            });


        /*
         * 如果網址本身帶有 #story
         * 預設仍然先顯示列表
         */

    } catch (error) {

        console.error(error);

        storyList.innerHTML = `
            <div class="error">
                文章載入失敗，請稍後再試。
            </div>
        `;
    }
}


/* =========================
   顯示單篇文章
========================= */

function showArticle(article) {

    const storyList =
        document.getElementById("storyList");

    const articleView =
        document.getElementById("articleView");


    storyList.style.display = "none";

    articleView.style.display = "block";


    articleView.innerHTML = `

        <article class="article">

            <h2>
                ${escapeHtml(
                    article.title || "未命名故事"
                )}
            </h2>

            <div class="article-date">
                ${formatDate(article.date)}
            </div>

            <div class="article-body">
                ${markdownToHtml(article.body)}
            </div>

        </article>

        <div class="article-navigation">

            <a href="#" id="backToList">
                ← 返回故事列表
            </a>

        </div>
    `;


    document
        .getElementById("backToList")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                articleView.style.display = "none";

                storyList.style.display = "grid";

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================
   啟動
========================= */

loadStories();

</script>

</body>
</html>
