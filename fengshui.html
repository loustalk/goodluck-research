<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>風水研究室｜好運研究所</title>

    <style>
        :root {
            --bg: #f7f0e8;
            --card: #fffaf4;
            --text: #514239;
            --subtext: #78685c;
            --line: #e8d5c7;

            --green-bg: #f8eee9;
            --green-line: #e9cfc1;
            --green-icon: #f0d9cc;
            --green-text: #9b6b58;

            --blue-bg: #f6f0e9;
            --blue-line: #e5d6c7;
            --blue-icon: #eee0d2;
            --blue-text: #8b705b;

            --gold-bg: #fbf3df;
            --gold-line: #e8d4a8;
            --gold-icon: #f3e2b8;
            --gold-text: #9a7538;

            --orange-bg: #f8eae0;
            --orange-line: #e8cbbb;
            --orange-icon: #f0d8c7;
            --orange-text: #a66f4e;

            --purple-bg: #f5eee9;
            --purple-line: #e4d1c8;
            --purple-icon: #eadbd4;
            --purple-text: #8d675a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;
            line-height: 1.8;
        }

        .page {
            width: min(1100px, calc(100% - 36px));
            margin: 0 auto;
            padding: 50px 0 80px;
        }

        /* =========================
           Hero
        ========================= */

        .hero {
            position: relative;
            padding: 62px 50px;
            margin-bottom: 28px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 8px 28px rgba(70, 55, 40, 0.045);
            overflow: hidden;
        }

        .hero::before {
            content: "🧭";
            display: block;
            margin-bottom: 12px;
            font-size: 42px;
        }

        .hero h1 {
            margin: 0 0 12px;
            font-size: clamp(32px, 5vw, 48px);
            letter-spacing: 0.04em;
        }

        .hero .subtitle {
            margin: 0;
            color: var(--subtext);
            font-size: 17px;
        }

        .hero-message {
            max-width: 780px;
            margin: 34px auto 0;
            padding: 28px 32px;
            background: var(--green-bg);
            border: 1px solid var(--green-line);
            border-radius: 20px;
        }

        .hero-message strong {
            display: block;
            margin-bottom: 8px;
            color: var(--green-text);
            font-size: clamp(22px, 3vw, 30px);
        }

        .hero-message span {
            color: var(--subtext);
            font-size: 16px;
        }

        /* =========================
           Sections
        ========================= */

        section {
            margin-bottom: 28px;
            padding: 42px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 6px 22px rgba(70, 55, 40, 0.035);
        }

        section h2 {
            margin: 0 0 24px;
            font-size: clamp(25px, 4vw, 32px);
            letter-spacing: 0.02em;
        }

        section p {
            margin: 0 0 18px;
            color: var(--subtext);
            font-size: 16px;
        }

        section p:last-child {
            margin-bottom: 0;
        }

        /* =========================
           Highlight
        ========================= */

        .highlight {
            position: relative;
            margin: 28px 0;
            padding: 28px 52px;
            border-radius: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            overflow: hidden;
        }

        .highlight::before {
            content: "✦";
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0.45;
        }

        .highlight::after {
            content: "✦";
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.35;
        }

        .highlight-green {
            background: var(--green-bg);
            border: 1px solid var(--green-line);
            color: var(--green-text);
        }

        .highlight-blue {
            background: var(--blue-bg);
            border: 1px solid var(--blue-line);
            color: var(--blue-text);
        }

        .highlight-gold {
            background: var(--gold-bg);
            border: 1px solid var(--gold-line);
            color: var(--gold-text);
        }

        .highlight-orange {
            background: var(--orange-bg);
            border: 1px solid var(--orange-line);
            color: var(--orange-text);
        }

        .highlight-purple {
            background: var(--purple-bg);
            border: 1px solid var(--purple-line);
            color: var(--purple-text);
        }

        /* =========================
           Five Grid Cards
        ========================= */

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-top: 28px;
        }

        .grid-card {
            position: relative;
            padding: 26px 16px;
            text-align: center;
            border: 1px solid;
            border-radius: 18px;
            overflow: hidden;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .grid-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(70, 55, 40, 0.07);
        }

        .grid-card .icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            border-radius: 50%;
            font-size: 27px;
        }

        .grid-card h3 {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .grid-card p {
            margin: 0;
            font-size: 13px;
            line-height: 1.65;
        }

        .grid-green {
            background: var(--green-bg);
            border-color: var(--green-line);
        }

        .grid-green .icon {
            background: var(--green-icon);
            color: var(--green-text);
        }

        .grid-blue {
            background: var(--blue-bg);
            border-color: var(--blue-line);
        }

        .grid-blue .icon {
            background: var(--blue-icon);
            color: var(--blue-text);
        }

        .grid-gold {
            background: var(--gold-bg);
            border-color: var(--gold-line);
        }

        .grid-gold .icon {
            background: var(--gold-icon);
            color: var(--gold-text);
        }

        .grid-orange {
            background: var(--orange-bg);
            border-color: var(--orange-line);
        }

        .grid-orange .icon {
            background: var(--orange-icon);
            color: var(--orange-text);
        }

        .grid-purple {
            background: var(--purple-bg);
            border-color: var(--purple-line);
        }

        .grid-purple .icon {
            background: var(--purple-icon);
            color: var(--purple-text);
        }

        /* =========================
           Process
        ========================= */

        .process {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-top: 28px;
        }

        .step {
            padding: 24px 15px;
            text-align: center;
            border: 1px solid;
            border-radius: 18px;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .step:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(70, 55, 40, 0.07);
        }

        .step .number {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 600;
        }

        .step h3 {
            margin: 0 0 7px;
            font-size: 17px;
        }

        .step p {
            margin: 0;
            font-size: 13px;
            line-height: 1.65;
        }

        .step-green {
            background: var(--green-bg);
            border-color: var(--green-line);
        }

        .step-green .number {
            background: var(--green-icon);
            color: var(--green-text);
        }

        .step-blue {
            background: var(--blue-bg);
            border-color: var(--blue-line);
        }

        .step-blue .number {
            background: var(--blue-icon);
            color: var(--blue-text);
        }

        .step-gold {
            background: var(--gold-bg);
            border-color: var(--gold-line);
        }

        .step-gold .number {
            background: var(--gold-icon);
            color: var(--gold-text);
        }

        .step-orange {
            background: var(--orange-bg);
            border-color: var(--orange-line);
        }

        .step-orange .number {
            background: var(--orange-icon);
            color: var(--orange-text);
        }

        .step-purple {
            background: var(--purple-bg);
            border-color: var(--purple-line);
        }

        .step-purple .number {
            background: var(--purple-icon);
            color: var(--purple-text);
        }

        /* =========================
           Quote
        ========================= */

        .quote {
            position: relative;
            margin-top: 26px;
            padding: 36px 44px;
            background: #fbf3e9;
            border: 1px solid #e8d2bf;
            border-left: 5px solid #b78368;
            border-radius: 18px;
            color: #655044;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 6px 18px rgba(70, 55, 40, 0.04);
        }

        .quote::before {
            content: "✦";
            display: block;
            margin-bottom: 5px;
            color: #b78368;
            font-size: 20px;
        }

        /* =========================
           Ending
        ========================= */

        .ending {
            position: relative;
            padding: 42px;
            background: #fff7ed;
            border: 1px solid #e8d3bf;
            border-radius: 20px;
            color: #655347;
            font-size: 17px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(70, 55, 40, 0.04);
        }

        .ending::before {
            content: "🧭";
            display: block;
            margin-bottom: 14px;
            font-size: 32px;
        }

        .ending strong {
            color: #514239;
        }

        .ending-main {
            display: block;
            margin: 24px 0;
            color: var(--green-text);
            font-size: 24px;
        }

        /* =========================
           Back
        ========================= */

        .back {
            text-align: center;
            padding-top: 10px;
        }

        .back a {
            display: inline-block;
            padding: 12px 24px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            text-decoration: none;
            color: var(--subtext);
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .back a:hover {
            background: #fffaf4;
            transform: translateY(-2px);
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 900px) {
            .grid-cards,
            .process {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 760px) {

            .page {
                width: min(100% - 22px, 1100px);
                padding: 28px 0 50px;
            }

            .hero {
                padding: 42px 22px;
                border-radius: 22px;
            }

            .hero-message {
                padding: 22px 18px;
            }

            section {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .grid-cards,
            .process {
                grid-template-columns: 1fr;
            }

            .grid-card {
                padding: 24px 18px;
            }

            .step {
                padding: 22px 18px;
            }

            .highlight {
                padding: 22px 42px;
                font-size: 18px;
            }

            .highlight::before {
                left: 14px;
            }

            .highlight::after {
                right: 14px;
            }

            .quote {
                padding: 28px 24px;
                font-size: 19px;
            }

            .ending {
                padding: 30px 24px;
            }

            .ending-main {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

            </span>

        </div>

    </header>
