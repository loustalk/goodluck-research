<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風水研究室｜好運研究所</title>

    <style>
        :root {
            --bg: #f3e6dc;
            --card: #fffaf6;
            --text: #76513f;
            --subtext: #8c6c5b;
            --line: #e6cbb9;

            --green-bg: #f8eee7;
            --green-line: #e8cdbb;
            --green-icon: #f0d9ca;
            --green-text: #a86e53;

            --blue-bg: #f7eee7;
            --blue-line: #e7d1c2;
            --blue-icon: #f0d9ca;
            --blue-text: #98705b;

            --gold-bg: #fbf2e4;
            --gold-line: #ead7b7;
            --gold-icon: #f0d9ca;
            --gold-text: #a17a43;

            --orange-bg: #f9eee6;
            --orange-line: #e8cbb8;
            --orange-icon: #f0d9ca;
            --orange-text: #a86e53;

            --purple-bg: #f8eee7;
            --purple-line: #e8cdbb;
            --purple-icon: #f0d9ca;
            --purple-text: #a86e53;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.8;
        }

        .page {
            width: min(1100px, calc(100% - 36px));
            margin: 0 auto;
            padding: 50px 0 80px;
        }

        /* =========================
           Hero
        ========================= */

        .hero {
            position: relative;
            padding: 62px 50px;
            margin-bottom: 28px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 8px 28px rgba(118, 81, 63, 0.045);
            overflow: hidden;
        }

        .hero::before {
            content: "🧭";
            display: block;
            margin-bottom: 12px;
            font-size: 42px;
        }

        .hero h1 {
            margin: 0 0 12px;
            font-size: clamp(32px, 5vw, 48px);
            letter-spacing: 0.04em;
        }

        .hero .subtitle {
            margin: 0;
            color: var(--subtext);
            font-size: 17px;
        }

        .hero-message {
            max-width: 780px;
            margin: 34px auto 0;
            padding: 28px 32px;
            background: var(--green-bg);
            border: 1px solid var(--green-line);
            border-radius: 20px;
        }

        .hero-message strong {
            display: block;
            margin-bottom: 8px;
            color: var(--green-text);
            font-size: clamp(22px, 3vw, 30px);
        }

        .hero-message span {
            color: var(--subtext);
            font-size: 16px;
        }

        /* =========================
           Sections
        ========================= */

        section {
            margin-bottom: 28px;
            padding: 42px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 6px 22px rgba(118, 81, 63, 0.035);
        }

        section h2 {
            margin: 0 0 24px;
            font-size: clamp(25px, 4vw, 32px);
            letter-spacing: 0.02em;
        }

        section p {
            margin: 0 0 18px;
            color: var(--subtext);
            font-size: 16px;
        }

        section p:last-child {
            margin-bottom: 0;
        }

        /* =========================
           Highlight
        ========================= */

        .highlight {
            position: relative;
            margin: 28px 0;
            padding: 28px 52px;
            border-radius: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            overflow: hidden;
        }

        .highlight::before {
            content: "✦";
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0.45;
        }

        .highlight::after {
            content: "✦";
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.35;
        }

        .highlight-green {
            background: var(--green-bg);
            border: 1px solid var(--green-line);
            color: var(--green-text);
        }

        .highlight-blue {
            background: var(--blue-bg);
            border: 1px solid var(--blue-line);
            color: var(--blue-text);
        }

        .highlight-gold {
            background: var(--gold-bg);
            border: 1px solid var(--gold-line);
            color: var(--gold-text);
        }

        .highlight-orange {
            background: var(--orange-bg);
            border: 1px solid var(--orange-line);
            color: var(--orange-text);
        }

        .highlight-purple {
            background: var(--purple-bg);
            border: 1px solid var(--purple-line);
            color: var(--purple-text);
        }

        /* =========================
           Five Grid Cards
        ========================= */

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-top: 28px;
        }

        .grid-card {
            position: relative;
            padding: 26px 16px;
            text-align: center;
            border: 1px solid;
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .grid-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(118, 81, 63, 0.07);
        }

        .grid-card .icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            border-radius: 50%;
            font-size: 27px;
        }

        .grid-card h3 {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .grid-card p {
            margin: 0;
            font-size: 13px;
            line-height: 1.65;
        }

        .grid-green {
            background: var(--green-bg);
            border-color: var(--green-line);
        }

        .grid-green .icon {
            background: var(--green-icon);
            color: var(--green-text);
        }

        .grid-blue {
            background: var(--blue-bg);
            border-color: var(--blue-line);
        }

        .grid-blue .icon {
            background: var(--blue-icon);
            color: var(--blue-text);
        }

        .grid-gold {
            background: var(--gold-bg);
            border-color: var(--gold-line);
        }
